*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0b09}body{font-family:Georgia,serif;user-select:none}#board{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(100,73,43,.18),transparent 45%),linear-gradient(rgba(15,12,9,.8),rgba(15,12,9,.9)),repeating-linear-gradient(7deg,#4a3723 0 2px,#3c2d1e 2px 5px);box-shadow:inset 0 0 160px #000}#board:before{content:"";position:absolute;inset:0;opacity:.18;background-image:radial-gradient(#b89a6d 1px,transparent 1px);background-size:10px 10px;mix-blend-mode:soft-light;pointer-events:none}#shade{position:absolute;inset:0;background:rgba(0,0,0,0);pointer-events:none;z-index:8;transition:.65s}#board.focus #shade{background:rgba(0,0,0,.5)}svg{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}#thread{fill:none;stroke:#8d2424;stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 1px 1px #000);opacity:0}#thread.draw{opacity:1;animation:draw .9s ease forwards}#board.focus #thread{stroke:#d13a35;stroke-width:5;filter:drop-shadow(0 0 8px rgba(255,67,55,.5))}@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}.photo{position:absolute;z-index:10;cursor:pointer;transform-origin:center;transition:left .85s cubic-bezier(.2,.75,.2,1),top .85s cubic-bezier(.2,.75,.2,1),width .85s cubic-bezier(.2,.75,.2,1),transform .85s cubic-bezier(.2,.75,.2,1),filter .55s,opacity .55s;filter:drop-shadow(0 18px 35px rgba(0,0,0,.48))}.photo img{display:block;width:100%;height:auto;border:9px solid #e8e0d1;background:#eee}.photo.inspect{left:50%;top:50%;width:min(78vw,980px);transform:translate(-50%,-50%) rotate(0deg);z-index:30}.photo.hidden{opacity:0;pointer-events:none}.photo.pinned{cursor:default}#p1.pinned{left:50%;top:55%;width:min(29vw,430px);transform:translate(-50%,-50%) rotate(-1.5deg)}#p2.pinned{left:20%;top:23%;width:min(25vw,370px);transform:translate(-50%,-50%) rotate(3deg)}.pin{position:absolute;left:50%;top:-7px;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8470,#a31f18 55%,#4f0b08 100%);box-shadow:0 4px 7px #000;opacity:0;transition:.25s .65s}.pinned .pin{opacity:1}#board.focus .photo{filter:brightness(.28) saturate(.55) drop-shadow(0 10px 20px #000)}#board.focus #p1,#board.focus #p2{filter:brightness(1) saturate(1) drop-shadow(0 20px 35px #000);z-index:14}#label{position:absolute;z-index:15;padding:8px 13px;background:#e8dfca;color:#24170f;border:1px solid #7d6750;font:700 14px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;box-shadow:0 5px 18px #000;opacity:0;transform:translate(-50%,-50%) rotate(-2deg) scale(.9);transition:.5s;pointer-events:none;white-space:nowrap}#board.focus #label{opacity:1;transform:translate(-50%,-50%) rotate(-2deg) scale(1)}

const board=document.getElementById('board'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),thread=document.getElementById('thread'),label=document.getElementById('label');let state=0,busy=false;
function pinPoint(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+5}}function threadPath(){const a=pinPoint(p1),b=pinPoint(p2),mx=(a.x+b.x)/2,my=(a.y+b.y)/2-35;thread.setAttribute('d',`M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`);label.style.left=mx+'px';label.style.top=(my-7)+'px'}function render(n,animate=true){state=Math.max(0,Math.min(3,n));board.classList.toggle('focus',state===3);thread.classList.remove('draw');thread.style.opacity=state>=2?'1':'0';if(state===0){p1.className='photo inspect';p2.className='photo hidden';}else if(state===1){p1.className='photo pinned';p2.className='photo inspect';}else{p1.className='photo pinned';p2.className='photo pinned';thread.style.opacity='0';const finish=()=>{threadPath();thread.style.opacity='1';if(animate&&state===2){thread.classList.remove('draw');void thread.getBoundingClientRect();thread.classList.add('draw')}};if(animate&&state===2){setTimeout(finish,880)}else{requestAnimationFrame(finish)}}busy=false}
p1.onclick=()=>{if(state!==0||busy)return;busy=true;render(1)};p2.onclick=()=>{if(state!==1||busy)return;busy=true;render(2)};board.addEventListener('click',e=>{if(state===2&&e.target!==p2&&!p2.contains(e.target))render(3)});document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();render(state-1,false)}if(e.key==='ArrowRight'){e.preventDefault();render(state+1,true)}});window.addEventListener('resize',()=>{if(state>=2)threadPath()});render(0,false);

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 38%,rgba(79,70,59,.20),transparent 44%),
repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px),
linear-gradient(135deg,#151311,#080807 72%);color:#f4f4f2;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{user-select:none;cursor:pointer}
#toMap{position:fixed;z-index:120;top:12px;right:14px;padding:7px 11px;border-radius:10px;border:1px solid #2c2925;background:rgba(14,13,12,.72);color:#8f897f;font-size:13px;text-decoration:none;opacity:.7;transition:.18s}
#toMap:hover{opacity:1;color:#eee8dc;border-color:#57514a}
/* Быстрые переходы для ведущего — левый нижний угол */
#jumps{position:fixed;z-index:120;left:14px;bottom:12px;display:flex;gap:6px}
#jumps button{font:13px Inter,system-ui,sans-serif;padding:6px 10px;border-radius:9px;border:1px solid #3a352f;background:rgba(14,13,12,.84);color:#c2b9ab;cursor:pointer;opacity:.9;transition:.18s}
#jumps button:hover{opacity:1;color:#eee8dc;border-color:#57514a}
#jumps button.on{color:#eee8dc;border-color:#8a5a3c}
#titleSlide{position:fixed;inset:0;display:grid;place-items:center;background:#050505;z-index:100;transition:opacity .42s,visibility .42s}
#titleSlide.hidden{opacity:0;visibility:hidden;pointer-events:none}
#titleSlide h1{margin:0;font-size:clamp(42px,7vw,110px);font-weight:760;letter-spacing:-.055em;text-align:center}
@font-face{font-family:CaseHand;src:url(./assets/fonts/caveat.woff) format("woff");font-display:swap}
@font-face{font-family:CaseType;src:url(./assets/fonts/ptmono.woff) format("woff");font-display:swap}
/* ── Стена расследования: пробка на весь экран ── */
#board{position:fixed;inset:0;opacity:0;visibility:hidden;transition:opacity .55s;overflow:hidden;background:#b4844f}
#board.visible{opacity:1;visibility:visible}
#cork{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#board:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:20;
background:radial-gradient(ellipse 60% 64% at 42% 46%,rgba(255,220,160,.12) 0,rgba(0,0,0,0) 46%,rgba(0,0,0,.6) 100%)}
/* антураж: вырезки, карта, карточка дела, стикеры — всё за фотографиями */
#decor{position:absolute;inset:0;z-index:2;pointer-events:none}
.clip{position:absolute;background:#e7dfcc;filter:blur(1.6px);opacity:.82;box-shadow:0 8px 18px rgba(0,0,0,.35);padding:10px;display:flex;flex-direction:column;gap:5%}
.clip i{display:block;height:5%;background:#9b9384}
.clip i:first-child{height:12%;background:#3b3631;margin-bottom:4%}
.mapPiece{position:absolute;filter:blur(1.4px);opacity:.75;background:repeating-linear-gradient(0deg,#cfd8c2 0 16px,#b9c6a9 16px 17px),repeating-linear-gradient(90deg,transparent 0 16px,#b9c6a9 16px 17px);background-blend-mode:multiply;box-shadow:0 8px 18px rgba(0,0,0,.35)}
.caseCard{position:absolute;background:#efe6d0;color:#2a2622;padding:12px 16px 14px;box-shadow:0 2px 2px rgba(0,0,0,.3),0 10px 22px rgba(0,0,0,.4);font-family:CaseType,monospace}
.caseCard b{display:block;font-weight:400;font-size:clamp(14px,1.3vw,22px);letter-spacing:.08em}
.caseCard hr{border:0;height:1px;background:#8d8270;margin:7px 0 6px}
.caseCard span{display:block;font-family:CaseHand,cursive;font-size:clamp(20px,1.9vw,32px);line-height:1;color:#1f2a52}
.tape{position:absolute;height:22px;background:rgba(232,220,186,.72);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sticky{position:absolute;width:clamp(90px,8.5vw,140px);aspect-ratio:1;padding:12px;display:grid;place-items:center;font-family:CaseHand,cursive;font-size:clamp(26px,2.6vw,44px);color:#2b2a26;box-shadow:0 2px 2px rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.35)}
.decorPin{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ff8d86 0 12%,#d4221b 30%,#8b0e0a 75%);box-shadow:2px 3px 4px rgba(0,0,0,.5)}
#ambient{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#ambient path{fill:none;stroke:#a5141c;stroke-width:2.2;opacity:.5;vector-effect:non-scaling-stroke;filter:drop-shadow(2px 3px 1px rgba(0,0,0,.4))}
#threads{position:absolute;inset:0;width:100%;height:100%;z-index:11;pointer-events:none}
#pins{position:absolute;inset:0;z-index:12;pointer-events:none}
#pins span{position:absolute;width:21px;height:21px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ff8d86 0 12%,#d4221b 30%,#8b0e0a 75%);box-shadow:3px 5px 5px rgba(0,0,0,.55)}
.thread{fill:none;stroke:#b5121b;stroke-width:3.6;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(3px 5px 2px rgba(0,0,0,.5));opacity:1}
.thread.draw{animation:drawThread .85s cubic-bezier(.22,.78,.22,1) both}
@keyframes drawThread{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pinPhoto{position:absolute;z-index:10;margin:0;transform-origin:center}
.pinPhoto img{display:block;width:100%;height:auto;border:solid #f4efe4;border-width:9px 9px 26px;background:#f4efe4;box-shadow:0 2px 2px rgba(0,0,0,.35),0 14px 28px rgba(0,0,0,.45)}
/* булавки рисуются отдельным слоем #pins — поверх нитей */
/* Раскладка «улик» вокруг паспорта (точка отсчёта в центре) */
#p1{width:22vw;left:50%;top:48.5%;transform:translate(-50%,-50%) rotate(-1deg)}
#p2{width:15vw;left:27%;top:3%;transform:rotate(2.4deg)}
#p3{width:15vw;left:4%;top:44%;transform:rotate(-2.1deg)}
#p4{width:16vw;left:78%;top:33%;transform:rotate(2.2deg)}
#p5{width:14vw;left:43%;top:74.5%;transform:rotate(-1.6deg)}
#p6{width:15vw;left:80%;top:4%;transform:rotate(2.6deg)}
#p7{width:19vw;left:16%;top:70%;transform:rotate(1.8deg)}
#p8{width:13vw;left:46.5%;top:3%;transform:rotate(-2deg)}
#p9{width:18vw;left:77%;top:68%;transform:rotate(-1.8deg)}
#p10{width:15vw;left:3%;top:15%;transform:rotate(-1.4deg)}
/* ── Разбор: вопрос группе, ответы, название фрейма вдоль нити ── */
#names{position:absolute;inset:0;width:100%;height:100%;z-index:11;pointer-events:none;overflow:visible}
.frameName{font-family:CaseType,monospace;font-size:clamp(18px,1.65vw,30px);letter-spacing:.1em;fill:#8e0c14;dominant-baseline:central;
  paint-order:stroke;stroke:rgba(246,232,200,.95);stroke-width:7px;stroke-linejoin:round}
#dim{position:absolute;inset:0;z-index:30;background:rgba(8,6,4,.64);opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;pointer-events:none}
#dim.on{opacity:1;visibility:visible}
.pinPhoto.focused{z-index:40}
#focusLayer{position:absolute;inset:0;width:100%;height:100%;z-index:41;pointer-events:none;overflow:visible}
#focusPins{position:absolute;inset:0;z-index:42;pointer-events:none}
#focusPins span{position:absolute;width:21px;height:21px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#ff8d86 0 12%,#d4221b 30%,#8b0e0a 75%);box-shadow:3px 5px 5px rgba(0,0,0,.55)}
#discuss{position:absolute;left:16%;right:16%;z-index:45;display:flex;flex-direction:column;align-items:center;gap:18px;pointer-events:none}
#discuss.top{top:3.5%}
#discuss.bottom{bottom:4.5%;flex-direction:column-reverse}
.qCard{background:#efe6d0;color:#2a2622;font-family:CaseType,monospace;font-size:clamp(22px,2.2vw,40px);line-height:1.15;padding:16px 28px 18px;
  box-shadow:0 2px 2px rgba(0,0,0,.3),0 14px 30px rgba(0,0,0,.5);transform:rotate(-.8deg);text-align:center;animation:qIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(-10px) rotate(-.8deg)}to{opacity:1;transform:rotate(-.8deg)}}
.notes{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:14px 16px}
.note{font-family:CaseHand,cursive;font-size:clamp(22px,2vw,36px);color:#2b2a26;padding:10px 16px 12px;line-height:1.05;max-width:17vw;text-align:center;
  box-shadow:0 2px 2px rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.4)}
.note.in{animation:noteIn .5s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes noteIn{from{opacity:0;transform:translateY(16px) scale(.85) rotate(var(--r))}to{opacity:1;transform:rotate(var(--r))}}
#stage{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,4,3,.56);backdrop-filter:blur(2px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
#stage.visible{opacity:1;visibility:visible}
#hero{display:block;width:auto;height:auto;max-width:none;max-height:none;object-fit:contain;border:11px solid #f4efe4;background:#f4efe4;box-shadow:0 35px 95px rgba(0,0,0,.8),0 4px 12px #000}
#fly{position:fixed;z-index:80;display:none;pointer-events:none;object-fit:contain;border:11px solid #f4efe4;background:#f4efe4;box-shadow:0 28px 74px #000b;transform-origin:top left}
@media(max-width:850px){
  #hero{border-width:8px}
}
</style>
</head>

<script>
(()=>{
const MAX=57; // 30 шагов «улик» + 9 раундов разбора по 3 шага
const title=document.getElementById('titleSlide');
const board=document.getElementById('board');
const stage=document.getElementById('stage');
const hero=document.getElementById('hero');
const fly=document.getElementById('fly');
const svg=document.getElementById('threads');
const pins=document.getElementById('pins');
const p1=document.getElementById('p1');
const p2=document.getElementById('p2');
const p3=document.getElementById('p3');
const p4=document.getElementById('p4');
const p5=document.getElementById('p5');
const p6=document.getElementById('p6');
const p7=document.getElementById('p7');
const p8=document.getElementById('p8');
const p9=document.getElementById('p9');
const p10=document.getElementById('p10');
const photos={
  1:"./assets/01-passport-ru.webp",
  2:"./assets/02-passport-us.webp",
  3:'./assets/03-coordination.webp',
  4:'./assets/04-comparison.webp',
  5:'./assets/05-conditional.webp',
  6:'./assets/06-spatial.webp',
  7:'./assets/07-opposition.webp',
  8:'./assets/08-temporal.webp',
  9:'./assets/09-deictic.webp',
  10:'./assets/10-hierarchy.webp'
};
let state=0;
let animating=false;
let epoch=0; // увеличивается при быстром переходе — отменяет незавершённые анимации

function rectOf(el){
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.top,w:r.width,h:r.height};
}
function pinPoint(el){
  const r=el.getBoundingClientRect();
  const br=board.getBoundingClientRect();
  return {
    x:(r.left+r.width/2-br.left)/br.width*1000,
    y:(r.top-1-br.top)/br.height*600
  };
}
function sizeHero(){
  const br=board.getBoundingClientRect();
  const iw=hero.naturalWidth||4;
  const ih=hero.naturalHeight||3;
  const maxW=Math.min(innerWidth*.84,br.width*.88,1240);
  const maxH=Math.min(innerHeight*.80,br.height*.86);
  const scale=Math.min(maxW/iw,maxH/ih);
  hero.style.width=Math.round(iw*scale)+'px';
  hero.style.height=Math.round(ih*scale)+'px';
  hero.style.maxWidth='none';
  hero.style.maxHeight='none';
}
function showHero(src){
  hero.onload=()=>sizeHero();
  hero.src=src;
  if(hero.complete) sizeHero();
  stage.classList.add('visible');
}
function hideHero(){
  stage.classList.remove('visible');
}
function clearThreads(){
  svg.innerHTML='';
}
function placePins(){
  pins.innerHTML='';
  [p1,p2,p3,p4,p5,p6,p7,p8,p9,p10].forEach(el=>{
    if(el.hidden||el.style.opacity==='0')return;
    const pt=pinPoint(el),d=document.createElement('span');
    d.style.left=(pt.x/10)+'%';d.style.top=(pt.y/6)+'%';
    pins.appendChild(d);
  });
}
function addThread(aEl,bEl,animated=false,key=''){
  const a=pinPoint(aEl),b=pinPoint(bEl);
  const dx=b.x-a.x,dy=b.y-a.y;
  const bend=Math.max(18,Math.abs(dx)*.06);
  const mx=(a.x+b.x)/2;
  const my=(a.y+b.y)/2 + bend*1.4; // нить провисает вниз
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','thread');
  path.dataset.key=key;
  path.setAttribute('d',`M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`);
  svg.appendChild(path);
  if(animated){
    // длина нити на экране (в пикселях), чтобы прорисовка доходила точно до булавки
    const br=board.getBoundingClientRect(),kx=br.width/1000,ky=br.height/600,n=40,len0=path.getTotalLength();
    let L=0,prev=null;
    for(let i=0;i<=n;i++){const q=path.getPointAtLength(len0*i/n),pt=[q.x*kx,q.y*ky];if(prev)L+=Math.hypot(pt[0]-prev[0],pt[1]-prev[1]);prev=pt;}
    L=Math.ceil(L)+4;
    path.style.strokeDasharray=L+' '+L;
    const anim=path.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:850,easing:'cubic-bezier(.22,.78,.22,1)',fill:'forwards'});
    anim.onfinish=()=>{path.style.strokeDasharray='';anim.cancel();};
  }
}
function resetFly(){
  fly.style.display='none';
  fly.style.transition='none';
  fly.style.transform='none';
}
function render(s){
  state=Math.max(0,Math.min(MAX,s));
  resetFly();
  title.classList.toggle('hidden',state!==0);
  board.classList.toggle('visible',state>=1);
  p1.hidden=state<3;
  p2.hidden=state<5;
  p3.hidden=state<8;
  p4.hidden=state<11;
  p5.hidden=state<14;
  p6.hidden=state<17;
  p7.hidden=state<20;
  p8.hidden=state<23;
  p9.hidden=state<26;
  p10.hidden=state<29;
  [p1,p2,p3,p4,p5,p6,p7,p8,p9,p10].forEach(el=>el.style.opacity='1');
  clearThreads();
  hideHero();

  if(state===2) showHero(photos[1]);
  if(state===4) showHero(photos[2]);
  if(state===7) showHero(photos[3]);
  if(state===10) showHero(photos[4]);
  if(state===13) showHero(photos[5]);
  if(state===16) showHero(photos[6]);
  if(state===19) showHero(photos[7]);
  if(state===22) showHero(photos[8]);
  if(state===25) showHero(photos[9]);
  if(state===28) showHero(photos[10]);

  if(state>=6) addThread(p1,p2,false,'t1');
  if(state>=9) addThread(p1,p3,false,'t2');
  if(state>=12) addThread(p1,p4,false,'t3');
  if(state>=15) addThread(p1,p5,false,'t4');
  if(state>=18) addThread(p1,p6,false,'t5');
  if(state>=21) addThread(p1,p7,false,'t6');
  if(state>=24) addThread(p1,p8,false,'t7');
  if(state>=27) addThread(p1,p9,false,'t8');
  if(state>=30) addThread(p1,p10,false,'t9');
  placePins();
  renderDiscussion(state);
  document.querySelectorAll('#jumps button').forEach(b=>b.classList.toggle('on',+b.dataset.to===state));
}
function animatePin(target,src,nextState){
  animating=true;
  const from=rectOf(hero);
  target.hidden=false;
  target.style.opacity='0';
  placePins();
  const to=rectOf(target);

  fly.src=src;
  Object.assign(fly.style,{
    display:'block',
    left:from.x+'px',
    top:from.y+'px',
    width:from.w+'px',
    height:from.h+'px',
    opacity:'1',
    transition:'none',
    transform:'none'
  });
  hideHero();

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const sx=to.w/from.w, sy=to.h/from.h;
    fly.style.transition='transform 760ms cubic-bezier(.2,.82,.2,1),opacity 130ms 690ms';
    fly.style.transform=`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${sx},${sy})`;
    const my=epoch;
    setTimeout(()=>{
      if(my!==epoch)return;
      state=nextState;
      fly.style.display='none';
      target.style.opacity='1';
      animating=false;
      render(state);
    },790);
  }));
}
function animateThread(nextState,a,b,key){
  animating=true;
  state=nextState;
  render(state);
  // все прежние нити уже нарисованы; самую новую (последнюю) рисуем заново — с анимацией
  if(svg.lastChild) svg.removeChild(svg.lastChild);
  addThread(a,b,true,key);
  const my=epoch;
  setTimeout(()=>{if(my===epoch)animating=false},880);
}
/* ══ Разбор доски ══════════════════════════════════════════════
   Порядок — как появлялись фото. Каждый раунд = 3 шага:
   1) вопрос группе  2) ответы  3) ответы сливаются в название фрейма вдоль нити.
   Ответы ниже — примерные (пока нет голосования с телефонов, D-018).
   Текст вопросов, ответов и названий можно менять прямо здесь. */
const FRAMES=[
  {el:p2, key:'t1', q:'Чем отличаются эти два кота?',
   a:['разные паспорта','один русский, другой американский','разное гражданство','у них разные имена','из разных стран'],
   name:'РАЗЛИЧИЕ'},
  {el:p3, key:'t2', q:'Кто этот клоун?',
   a:['это тот же кот','Мурзик','он же, только в костюме','тот же самый','наш кот'],
   name:'КООРДИНАЦИЯ'},
  {el:p4, key:'t3', q:'Кто тяжелее?',
   a:['капибара','капибара тяжелее','кот легче','капибара больше весит','кот легче капибары'],
   name:'СРАВНЕНИЕ'},
  {el:p5, key:'t4', q:'Почему кот подпрыгнул?',
   a:['испугался пылесоса','из-за пылесоса','если включить пылесос — он прыгает','пылесос шумит','потому что пылесос'],
   name:'УСЛОВИЕ'},
  {el:p6, key:'t5', q:'Где кот?',
   a:['в коробке','внутри коробки','прячется в коробке','под крышкой','в коробке на ковре'],
   name:'ПРОСТРАНСТВО'},
  {el:p7, key:'t6', q:'Кто они друг для друга?',
   a:['мужчина и женщина','жених и невеста','противоположности','он и она','муж и жена'],
   name:'ПРОТИВОПОСТАВЛЕНИЕ'},
  {el:p8, key:'t7', q:'Кого кот видит в зеркале?',
   a:['себя в детстве','себя маленьким','котёнка, которым был','своё прошлое','каким он был раньше'],
   name:'ВРЕМЯ'},
  {el:p9, key:'t8', q:'Чьими глазами мы смотрим?',
   a:['глазами кота','мы — кот','изнутри кота','от первого лица','как будто я кот'],
   name:'ДЕЙКСИС'},
  {el:p10, key:'t9', q:'Кем кот видит себя во сне?',
   a:['царём зверей','вожаком','главным в стае','львом-королём','выше всех'],
   name:'ИЕРАРХИЯ'}
];
const NOTE_COLORS=['#f3d55b','#f6e27a','#9fd3e8','#f6a5b8','#cfe8a9'];
const NOTE_TILT=[-3,2.5,-1.5,3,-2.5];
const names=document.getElementById('names');
const dim=document.getElementById('dim');
const focusLayer=document.getElementById('focusLayer');
const focusPins=document.getElementById('focusPins');
const discuss=document.getElementById('discuss');
const NS='http://www.w3.org/2000/svg';
let animateNameFor=-1, animateNotesIn=false;

function discussInfo(s){
  if(s<=30)return null;
  const i=s-31;
  return {k:Math.floor(i/3),phase:i%3+1};
}
// та же кривая, что у нити (addThread), но в пикселях доски
function threadPx(aEl,bEl){
  const br=board.getBoundingClientRect(),bw=br.width,bh=br.height;
  const a=pinPoint(aEl),b=pinPoint(bEl);
  const bend=Math.max(18,Math.abs(b.x-a.x)*.06);
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2+bend*1.4;
  const X=v=>v/1000*bw,Y=v=>v/600*bh;
  return {bw,bh,A:[X(a.x),Y(a.y)],C:[X(mx),Y(my)],B:[X(b.x),Y(b.y)]};
}
function pathD(P,Q,C){return `M ${P[0]} ${P[1]} Q ${C[0]} ${C[1]} ${Q[0]} ${Q[1]}`}
function drawName(k,anim){
  const f=FRAMES[k],g=threadPx(p1,f.el);
  names.setAttribute('viewBox',`0 0 ${g.bw} ${g.bh}`);
  // текст всегда читается слева направо (или сверху вниз)
  const flip=g.B[0]<g.A[0]-1;
  const th=document.createElementNS(NS,'path');
  th.setAttribute('d',pathD(g.A,g.B,g.C));th.setAttribute('class','thread');
  names.appendChild(th);
  const guide=document.createElementNS(NS,'path');
  guide.id='nameGuide'+k;guide.setAttribute('fill','none');
  guide.setAttribute('d',flip?pathD(g.B,g.A,g.C):pathD(g.A,g.B,g.C));
  names.appendChild(guide);
  const tx=document.createElementNS(NS,'text');tx.setAttribute('class','frameName');
  const tp=document.createElementNS(NS,'textPath');
  tp.setAttribute('href','#nameGuide'+k);tp.setAttribute('startOffset','50%');tp.setAttribute('text-anchor','middle');
  tp.textContent=f.name;tx.appendChild(tp);names.appendChild(tx);
  // название ставим на самый длинный участок нити, свободный от фотографий
  const L=th.getTotalLength();
  const br=board.getBoundingClientRect();
  const rects=[...board.querySelectorAll('.pinPhoto')].filter(e=>!e.hidden).map(e=>{const r=e.getBoundingClientRect();return [r.left-br.left-4,r.top-br.top-4,r.right-br.left+4,r.bottom-br.top+4]});
  let best=[0,L],run=null;
  for(let l=0;l<=L;l+=3){
    const q=th.getPointAtLength(l),free=!rects.some(([x1,y1,x2,y2])=>q.x>x1&&q.x<x2&&q.y>y1&&q.y<y2);
    if(free){if(!run)run=[l,l];run[1]=l;if(!best.free||run[1]-run[0]>best[1]-best[0]){best=[run[0],run[1]];best.free=true;}}
    else run=null;
  }
  const c=(best[0]+best[1])/2,room=best[1]-best[0];
  let w=tx.getComputedTextLength();
  if(w+22>room&&room>40){
    tx.style.letterSpacing='.02em';w=tx.getComputedTextLength();
  }
  if(w+22>room&&room>40){
    const fs=parseFloat(getComputedStyle(tx).fontSize);
    tx.style.fontSize=Math.max(12,fs*(room-22)/w)+'px';
    w=tx.getComputedTextLength();
  }
  tp.setAttribute('startOffset',flip?(L-c):c);
  // в нити открывается «окно» под название — текст становится частью нити
  const gap=Math.min(room,w+30),d1=Math.max(0,c-gap/2);
  th.style.strokeDasharray=`${d1} ${gap} ${L}`;
  const orig=svg.querySelector(`path[data-key="${f.key}"]`);
  if(orig)orig.style.opacity='0';
  if(anim){
    th.animate([{strokeDasharray:`${c} 0 ${L}`},{strokeDasharray:`${d1} ${gap} ${L}`}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'});
    tx.animate([{opacity:0,filter:'blur(5px)'},{opacity:1,filter:'blur(0)'}],{duration:700,delay:150,easing:'ease-out',fill:'backwards'});
  }
}
function renderDiscussion(s){
  names.innerHTML='';focusLayer.innerHTML='';focusPins.innerHTML='';discuss.innerHTML='';discuss.className='';
  [p1,...FRAMES.map(f=>f.el)].forEach(el=>el.classList.remove('focused'));
  for(let k=0;k<FRAMES.length;k++){
    if(s>=33+3*k) drawName(k,k===animateNameFor);
  }
  animateNameFor=-1;
  const info=discussInfo(s);
  if(!info||info.phase===3){dim.classList.remove('on');animateNotesIn=false;return;}
  const f=FRAMES[info.k];
  dim.classList.add('on');
  p1.classList.add('focused');f.el.classList.add('focused');
  // нить и булавки выбранной пары — поверх затемнения
  const g=threadPx(p1,f.el);
  focusLayer.setAttribute('viewBox',`0 0 ${g.bw} ${g.bh}`);
  const th=document.createElementNS(NS,'path');th.setAttribute('d',pathD(g.A,g.B,g.C));th.setAttribute('class','thread');th.id='focusThread';
  focusLayer.appendChild(th);
  [g.A,g.B].forEach(([x,y])=>{const d=document.createElement('span');d.style.left=x+'px';d.style.top=y+'px';focusPins.appendChild(d)});
  // вопрос и ответы — на противоположной от фото стороне
  discuss.className=(g.B[1]>g.bh*.5)?'top':'bottom';
  const q=document.createElement('div');q.className='qCard';q.textContent=f.q;discuss.appendChild(q);
  if(info.phase===2){
    const wrap=document.createElement('div');wrap.className='notes';
    f.a.forEach((txt,i)=>{
      const n=document.createElement('div');n.className='note'+(animateNotesIn?' in':'');
      n.textContent=txt;n.style.background=NOTE_COLORS[i%NOTE_COLORS.length];
      n.style.setProperty('--r',NOTE_TILT[i%NOTE_TILT.length]+'deg');n.style.transform=`rotate(${NOTE_TILT[i%NOTE_TILT.length]}deg)`;
      if(animateNotesIn)n.style.animationDelay=(i*260)+'ms';
      wrap.appendChild(n);
    });
    discuss.appendChild(wrap);
  }
  animateNotesIn=false;
}
// ответы слетаются к середине нити и становятся названием фрейма
function animateMerge(nextState){
  animating=true;
  const k=discussInfo(nextState).k;
  const th=document.getElementById('focusThread');
  const br=board.getBoundingClientRect();
  let tx=br.width/2,ty=br.height/2;
  if(th){const L=th.getTotalLength(),pt=th.getPointAtLength(L/2);tx=pt.x;ty=pt.y;}
  const notes=[...discuss.querySelectorAll('.note')];
  notes.forEach((n,i)=>{
    const r=n.getBoundingClientRect();
    const dx=tx-(r.left+r.width/2-br.left),dy=ty-(r.top+r.height/2-br.top);
    n.animate([{transform:n.style.transform,opacity:1},{transform:`translate(${dx}px,${dy}px) scale(.25)`,opacity:0}],
      {duration:700,delay:i*70,easing:'cubic-bezier(.5,0,.3,1)',fill:'forwards'});
  });
  const q=discuss.querySelector('.qCard');
  if(q)q.animate([{opacity:1},{opacity:0}],{duration:450,delay:250,fill:'forwards'});
  const my=epoch;
  setTimeout(()=>{
    if(my!==epoch)return;
    state=nextState;animateNameFor=k;animating=false;render(state);
  },700+notes.length*70);
}

function forward(){
  if(animating||state>=MAX)return;
  const next=state+1;
  if(next===3){animatePin(p1,photos[1],3);return}
  if(next===5){animatePin(p2,photos[2],5);return}
  if(next===6){animateThread(6,p1,p2,'t1');return}
  if(next===8){animatePin(p3,photos[3],8);return}
  if(next===9){animateThread(9,p1,p3,'t2');return}
  if(next===11){animatePin(p4,photos[4],11);return}
  if(next===12){animateThread(12,p1,p4,'t3');return}
  if(next===14){animatePin(p5,photos[5],14);return}
  if(next===15){animateThread(15,p1,p5,'t4');return}
  if(next===17){animatePin(p6,photos[6],17);return}
  if(next===18){animateThread(18,p1,p6,'t5');return}
  if(next===20){animatePin(p7,photos[7],20);return}
  if(next===21){animateThread(21,p1,p7,'t6');return}
  if(next===23){animatePin(p8,photos[8],23);return}
  if(next===24){animateThread(24,p1,p8,'t7');return}
  if(next===26){animatePin(p9,photos[9],26);return}
  if(next===27){animateThread(27,p1,p9,'t8');return}
  if(next===29){animatePin(p10,photos[10],29);return}
  if(next===30){animateThread(30,p1,p10,'t9');return}
  const di=discussInfo(next);
  if(di&&di.phase===3){animateMerge(next);return}
  if(di&&di.phase===2){animateNotesIn=true;}
  render(next);
}
function back(){
  if(animating||state<=0)return;
  render(state-1);
}

document.addEventListener('click',e=>{
  if(e.button!==0)return;
  if(e.target.closest&&e.target.closest('a,#jumps'))return;
  forward();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){
    e.preventDefault();forward();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();back();
  }
});
window.addEventListener('resize',()=>render(state));
function jumpTo(n){
  epoch++;animating=false;animateNameFor=-1;animateNotesIn=false;
  document.getAnimations().forEach(a=>a.cancel());
  render(n);
}
document.querySelectorAll('#jumps button').forEach(b=>b.addEventListener('click',e=>{
  e.stopPropagation();jumpTo(+b.dataset.to);b.blur();
}));
render(0);
})();
</script>

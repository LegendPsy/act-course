<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Реляционные фреймы — доска расследования</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 38%,rgba(79,70,59,.20),transparent 44%),
repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 5px),
linear-gradient(135deg,#151311,#080807 72%);color:#f4f4f2;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body{user-select:none;cursor:pointer}
#titleSlide{position:fixed;inset:0;display:grid;place-items:center;background:#050505;z-index:100;transition:opacity .42s,visibility .42s}
#titleSlide.hidden{opacity:0;visibility:hidden;pointer-events:none}
#titleSlide h1{margin:0;font-size:clamp(42px,7vw,110px);font-weight:760;letter-spacing:-.055em;text-align:center}
#board{position:fixed;inset:clamp(32px,4.2vw,72px) clamp(42px,5.3vw,92px);opacity:0;visibility:hidden;transition:opacity .55s;overflow:hidden;border-radius:5px;
background:
radial-gradient(circle at 18% 22%,rgba(255,239,205,.07) 0 1px,transparent 2px),
radial-gradient(circle at 78% 66%,rgba(0,0,0,.24) 0 1px,transparent 2px),
repeating-linear-gradient(7deg,rgba(255,255,255,.018) 0 1px,transparent 1px 8px),
repeating-linear-gradient(92deg,rgba(45,26,14,.055) 0 2px,transparent 2px 11px),
linear-gradient(125deg,#5a402c 0%,#3b2a1f 46%,#2b2018 100%);
background-size:17px 17px,23px 23px,auto,auto,auto;
box-shadow:
0 0 0 7px #2b180f,
0 0 0 15px #6f4527,
0 0 0 19px #2a170e,
0 26px 72px rgba(0,0,0,.78),
inset 0 0 70px rgba(0,0,0,.42),
inset 0 0 0 1px rgba(255,225,183,.16)}
#board.visible{opacity:1;visibility:visible}
#board:before{content:"";position:absolute;inset:0;pointer-events:none;background:
radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.24) 100%),
linear-gradient(90deg,rgba(0,0,0,.08),transparent 12%,transparent 88%,rgba(0,0,0,.08));z-index:20}
#threads{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.thread{fill:none;stroke:#9a2430;stroke-width:3.2;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.95));opacity:.96}
.thread.draw{animation:drawThread .85s cubic-bezier(.22,.78,.22,1) both}
@keyframes drawThread{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.pinPhoto{position:absolute;z-index:10;margin:0;transform-origin:center}
.pinPhoto img{display:block;width:100%;height:auto;border:8px solid #e9e4d9;background:#e9e4d9;box-shadow:0 16px 34px rgba(0,0,0,.58),0 2px 5px rgba(0,0,0,.8)}
.pinPhoto:before{content:"";position:absolute;z-index:12;left:50%;top:-8px;width:17px;height:17px;border-radius:50%;transform:translateX(-50%);background:radial-gradient(circle at 35% 30%,#e8d5ae 0 14%,#963231 20% 61%,#3b0c0c 68% 100%);box-shadow:0 2px 5px #000a}
#p1{width:min(29vw,450px);left:50%;top:51%;transform:translate(-50%,-50%) rotate(-1deg)}
#p2{width:min(20vw,310px);left:9%;top:8%;transform:rotate(2.4deg)}
#p3{width:min(22vw,340px);left:10%;top:48%;transform:rotate(-2.1deg)}
#stage{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,4,3,.56);backdrop-filter:blur(2px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s,visibility .35s}
#stage.visible{opacity:1;visibility:visible}
#hero{display:block;width:min(86vw,1240px);height:auto;max-height:82vh;object-fit:contain;border:11px solid #eee8dc;background:#eee8dc;box-shadow:0 35px 95px rgba(0,0,0,.8),0 4px 12px #000}
#fly{position:fixed;z-index:80;display:none;pointer-events:none;object-fit:contain;border:11px solid #eee8dc;background:#eee8dc;box-shadow:0 28px 74px #000b;transform-origin:top left}
@media(max-width:850px){
  #board{inset:24px 22px;box-shadow:
    0 0 0 5px #2b180f,
    0 0 0 11px #6f4527,
    0 0 0 14px #2a170e,
    0 18px 46px rgba(0,0,0,.78),
    inset 0 0 52px rgba(0,0,0,.42)}
  #p1{width:39vw;top:53%}
  #p2{width:29vw;left:5%;top:9%}
  #p3{width:31vw;left:6%;top:53%}
  #hero{width:92vw;max-width:92vw;max-height:80vh;border-width:8px}
}
</style>
</head>

let state=0;
let animating=false;

function rectOf(el){
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.top,w:r.width,h:r.height};
}
function pinPoint(el){
  const r=el.getBoundingClientRect();
  const br=board.getBoundingClientRect();
  return {
    x:(r.left+r.width/2-br.left)/br.width*1000,
    y:(r.top-1-br.top)/br.height*600
  };
}
function showHero(src){
  hero.src=src;
  stage.classList.add('visible');
}
function hideHero(){
  stage.classList.remove('visible');
}
function clearThreads(){
  svg.innerHTML='';
}
function addThread(aEl,bEl,animated=false,key=''){
  const a=pinPoint(aEl),b=pinPoint(bEl);
  const dx=b.x-a.x,dy=b.y-a.y;
  const bend=Math.max(18,Math.abs(dx)*.06);
  const mx=(a.x+b.x)/2;
  const my=(a.y+b.y)/2 + (key==='t2'?bend:-bend);
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('class','thread'+(animated?' draw':''));
  path.setAttribute('d',`M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`);
  if(animated){
    path.setAttribute('pathLength','1');
    path.style.strokeDasharray='1';
    path.style.strokeDashoffset='1';
  }
  svg.appendChild(path);
}
function resetFly(){
  fly.style.display='none';
  fly.style.transition='none';
  fly.style.transform='none';
}
function render(s){
  state=Math.max(0,Math.min(MAX,s));
  resetFly();
  title.classList.toggle('hidden',state!==0);
  board.classList.toggle('visible',state>=1);
  p1.hidden=state<3;
  p2.hidden=state<5;
  p3.hidden=state<8;
  p1.style.opacity='1';p2.style.opacity='1';p3.style.opacity='1';
  clearThreads();
  hideHero();

  if(state===2) showHero(photos[1]);
  if(state===4) showHero(photos[2]);
  if(state===7) showHero(photos[3]);

  if(state>=6) addThread(p1,p2,false,'t1');
  if(state>=9) addThread(p1,p3,false,'t2');
}
function animatePin(target,src,nextState){
  animating=true;
  const from=rectOf(hero);
  target.hidden=false;
  target.style.opacity='0';
  const to=rectOf(target);

  fly.src=src;
  Object.assign(fly.style,{
    display:'block',
    left:from.x+'px',
    top:from.y+'px',
    width:from.w+'px',
    height:from.h+'px',
    opacity:'1',
    transition:'none',
    transform:'none'
  });
  hideHero();

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const sx=to.w/from.w, sy=to.h/from.h;
    fly.style.transition='transform 760ms cubic-bezier(.2,.82,.2,1),opacity 130ms 690ms';
    fly.style.transform=`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${sx},${sy})`;
    setTimeout(()=>{
      state=nextState;
      fly.style.display='none';
      target.style.opacity='1';
      animating=false;
      render(state);
    },790);
  }));
}
function animateThread(nextState,a,b,key){
  animating=true;
  state=nextState;
  render(state);
  clearThreads();
  if(state>=6){
    if(key==='t1'){
      addThread(a,b,true,'t1');
    }else{
      addThread(p1,p2,false,'t1');
      addThread(a,b,true,'t2');
    }
  }
  setTimeout(()=>{animating=false},880);
}
function forward(){
  if(animating||state>=MAX)return;
  const next=state+1;
  if(next===3){animatePin(p1,photos[1],3);return}
  if(next===5){animatePin(p2,photos[2],5);return}
  if(next===6){animateThread(6,p1,p2,'t1');return}
  if(next===8){animatePin(p3,photos[3],8);return}
  if(next===9){animateThread(9,p1,p3,'t2');return}
  render(next);
}
function back(){
  if(animating||state<=0)return;
  render(state-1);
}

document.addEventListener('click',e=>{
  if(e.button!==0)return;
  forward();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){
    e.preventDefault();forward();
  }else if(e.key==='ArrowLeft'){
    e.preventDefault();back();
  }
});
window.addEventListener('resize',()=>render(state));
render(0);
})();
</script>
</body>

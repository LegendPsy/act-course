Object.values(badgeEl).forEach(g=>svg.appendChild(g));   // значки — поверх линий

// ───────── Живая сеть: позиции, плавные переезды, лёгкий дрейф ─────────
const TW=1500;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const tgt={},from={},base={},pos={};let t0=-1e9,layFrom='0',layTo='0',kNow=1;
const DRIFT={};Object.keys(NODES).forEach((id,i)=>{const h=Math.abs(hash(id));DRIFT[id]=[.55+(h%7)*.07,.45+(h%5)*.08,h%628/100,(h>>3)%628/100]});
function layoutOf(s){
  const L=LAYOUT[s.lay]||{},o={};
  Object.keys(NODES).forEach(id=>{const p=L[id];o[id]=p?{x:p[0],y:p[1]}:{x:NODES[id][1],y:NODES[id][2]}});
  let vis=0;
  EXIT_ORDER.forEach(([id])=>{const v=s.exits[id]||'x-off';o['x:'+id]={x:EXIT_X+6,y:v!=='x-off'?EXIT_Y0+(vis++)*EXIT_DY:EXITS[id][1]}});
  return o;
}
function retarget(s,animate,old){
  const L=layoutOf(s);
  Object.keys(L).forEach(k=>{
    const id=k.startsWith('x:')?k.slice(2):k;
    const wasOn=old&&(k.startsWith('x:')?(old.exits[id]&&old.exits[id]!=='x-off'):old.nodes[id]);
    from[k]=(animate&&wasOn&&base[k])?{...base[k]}:{...L[k]};
    tgt[k]=L[k];
  });
  layFrom=animate?layTo:s.lay;layTo=s.lay;
  t0=animate?performance.now():-1e9;
}
function endPt(id){return pos[id]||pos['x:'+id]}
function edgeGeom(key){
  const [a,b]=key.split('>');const A=endPt(a),B=endPt(b);
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  const d0=(hash(key)%2?1:-1)*Math.min(26,len*.07),bf=(BENDS[layFrom]||{})[key],bt=(BENDS[layTo]||{})[key];
  const b0=bf!==undefined?bf:d0,b1=bt!==undefined?bt:d0,bend=b0+(b1-b0)*kNow;
  const cx=(A.x+B.x)/2-dy/len*bend,cy=(A.y+B.y)/2+dx/len*bend;
  return {d:`M${A.x.toFixed(1)} ${A.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${B.x.toFixed(1)} ${B.y.toFixed(1)}`,mx:.25*A.x+.5*cx+.25*B.x,my:.25*A.y+.5*cy+.25*B.y};
}
let still=false;   // для проверок: выключает дрейф
function frame(now){
  const k=ease(Math.max(0,Math.min(1,(now-t0)/TW))),T=now/1000;kNow=k;
  Object.keys(tgt).forEach(key=>{
    const F=from[key],G=tgt[key];
    const b={x:F.x+(G.x-F.x)*k,y:F.y+(G.y-F.y)*k};base[key]=b;
    if(key.startsWith('x:')){pos[key]=b;const el=exitEl[key.slice(2)];const v=b.y.toFixed(1)+'px';if(el.style.top!==v)el.style.top=v;return}
    let px=b.x,py=b.y;
    if(!ANCHOR.has(key)&&!still){const [w1,w2,p1,p2]=DRIFT[key];px+=4*Math.sin(T*w1+p1);py+=3*Math.cos(T*w2+p2)}
    pos[key]={x:px,y:py};
    const el=nodeEl[key];el.style.left=px.toFixed(1)+'px';el.style.top=py.toFixed(1)+'px';
  });
  Object.entries(edgeEl).forEach(([key,p])=>{
    if(p.classList.contains('off')&&!p._fading)return;
    const g=edgeGeom(key);p.setAttribute('d',g.d);
    if(badgeEl[key])badgeEl[key].setAttribute('transform',`translate(${g.mx.toFixed(1)} ${g.my.toFixed(1)})`);
  });
  requestAnimationFrame(frame);
}

// ───────── Отрисовка ─────────
let state=0,prev=null,epoch=0;
function fit(){
  const s=Math.min(innerWidth/1600,innerHeight/900);
  stage.style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`;
}
function setCard(c){
  const key=JSON.stringify(c);
  if($('card').dataset.key===key)return;
  $('card').dataset.key=key;
  $('eyebrow').textContent=c?c[0]:'';$('main').textContent=c?c[1]:'';$('sub').textContent=c?c[2]:'';
  $('card').style.opacity=c?1:0;
  if(c){const el=$('card');el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
}
function render(i,animate){
  state=Math.max(0,Math.min(MAX,i));
  const s=steps[state].st,old=prev,fx=steps[state].fx;
  if(!animate)document.body.classList.add('instant');
  title.classList.toggle('hidden',!s.title);
  setCard(s.card);
  retarget(s,animate,old);
  const solo=s.solo?new Set(s.solo):null,front=new Set(s.front);
  // узлы
  Object.keys(NODES).forEach(id=>{
    const el=nodeEl[id],c=s.nodes[id];
    let cls='node '+(c?(c==='stim'?'stim':c):'off');
    if(solo&&solo.has(id))cls+=' keep';
    if(front.has(id))cls+=' front';
    if(id==='eda'&&fx.converge&&animate)later(()=>el.classList.add('glow'),2600);
    else if(id==='eda'&&c==='c-core'&&s.edaK>=1.7)cls+=' glow';
    const tint=animate&&fx.tintFrom&&fx.tintFrom[id];
    if(animate&&old&&old.nodes[id]&&c&&old.nodes[id]!==c)el.style.transitionDelay='.6s';else el.style.transitionDelay='';
    el.className=tint?cls.replace(c,tint):cls;
    if(tint)later(()=>{el.style.transitionDelay='';el.className=cls},700);
    const sc=(id==='eda'?s.edaK:1)*(front.has(id)?1.12:1);
    el.style.transform=`translate(-50%,-50%) scale(${sc})`;
  });
  cam.classList.toggle('front',front.size>0);
  // связи
  Object.entries(edgeEl).forEach(([key,p])=>{
    const on=!!s.edges[key];const was=old&&old.edges[key];
    const [a,b]=key.split('>');
    p.classList.toggle('off',!on);
    p.classList.toggle('keep',!!(solo&&solo.has(a)&&solo.has(b)));
    p.classList.toggle('front',front.has(a)&&front.has(b));
    if(badgeEl[key])badgeEl[key].classList.toggle('off',!on);
    if(on){const g=edgeGeom0(key);p.setAttribute('d',g.d);if(badgeEl[key])badgeEl[key].setAttribute('transform',`translate(${g.mx} ${g.my})`)}
    if(animate&&on&&!was)drawIn(p,badgeEl[key]);
  });
  // выходы
  EXIT_ORDER.forEach(([id])=>{
    const el=exitEl[id],v=s.exits[id]||'x-off';
    const burn=el.classList.contains('burn')&&s.free;
    el.className='exit '+v+(id==='hudet'&&s.strong?' strong':'')+(burn?' burn':'')+(solo&&solo.has(id)?' keep':'');
  });
  $('exitsHead').style.opacity=Object.keys(s.exits).length?1:0;
  // лента
  tlEls.forEach(([dot,a,nm],k)=>{
    const now=k===s.tl,past=k<s.tl;
    dot.className='tlDot'+(now?' now':past?' past':'');
    a.className='tlAge'+(now?' now':'')+(k>s.tl?' tlHide':'');
    nm.className='tlName'+(now?' now':'')+(k>s.tl?' tlHide':'');
  });
  $('tl').style.opacity=(s.title||solo||s.free)?0:1;
  cam.classList.toggle('solo',!!solo);
  // коллаж-знакомство
  $('collage').classList.toggle('on',s.collage!==null&&s.collage!==undefined);
  coverEl.forEach((c,k)=>c.classList.toggle('open',s.collage!==null&&k<s.collage));
  // сцена-картинка
  if(s.scene){
    const sc=SCENES[s.scene.id];
    if($('sceneImg').dataset.id!==s.scene.id){$('sceneImg').src=sc.src;$('sceneImg').dataset.id=s.scene.id}
    $('scene').classList.add('on');
    document.fonts.ready.then(()=>placeDots(s.scene.id));placeDots(s.scene.id);
    Object.entries(bubEls).forEach(([id,arr])=>arr.forEach((B,k)=>{
      const on=id===s.scene.id&&k<s.scene.b;B.el.classList.toggle('on',on);B.dots.forEach(d=>d.classList.toggle('on',on));
    }));
  }else{
    $('scene').classList.remove('on');
    Object.values(bubEls).forEach(arr=>arr.forEach(B=>{B.el.classList.remove('on');B.dots.forEach(d=>d.classList.remove('on'))}));
  }
  Object.entries(thumbEl).forEach(([id,im])=>{
    const on=s.thumbs.includes(id);im.classList.toggle('on',on&&!(animate&&fx.fly===id));
    im.classList.toggle('now',SCENES[id].tl===s.tl);
  });
  if(animate&&fx.fly)flyToThumb(fx.fly);
  $('q').textContent=s.q;$('q').classList.toggle('on',!!s.q);
  document.body.classList.toggle('free',s.free);
  document.querySelectorAll('#jumps button').forEach(b=>b.classList.toggle('on',MARK[b.dataset.mark]===state));
  if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('instant')));
  if(animate)runFx(fx);
  prev=s;
}
// геометрия связи по целевым местам (до того, как кадр анимации её обновит)
function edgeGeom0(key){
  const save={...pos};
  Object.keys(from).forEach(k=>pos[k]=from[k]);
  const g=edgeGeom(key);Object.keys(pos).forEach(k=>delete pos[k]);Object.assign(pos,save);
  return {d:g.d,mx:g.mx.toFixed(1),my:g.my.toFixed(1)};
}
function flyToThumb(id){
  const sc=SCENES[id],f=$('flyImg'),th=thumbEl[id];
  const X=120+sc.tl*(1360/(TL.length-1));
  const to={x:X-36,y:803,w:72,h:40.5},from={...(sc.rect||{x:IMG.x,y:IMG.y,w:1440,h:810})};
  f.src=sc.src;Object.assign(f.style,{display:'block',left:from.x+'px',top:from.y+'px',width:from.w+'px',height:from.h+'px'});
  const an=f.animate([{transform:'none',opacity:1},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${to.w/from.w},${to.h/from.h})`,opacity:1}],
    {duration:900,easing:'cubic-bezier(.45,.05,.25,1)'});
  an.onfinish=()=>{f.style.display='none';th.classList.add('on')};
  an.oncancel=()=>{f.style.display='none'};
}
function drawIn(p,badge){
  if(badge)badge.animate([{opacity:0},{opacity:1}],{duration:700,delay:700,fill:'backwards'});
  if(/e-(d|s|b|o)\b/.test(p.getAttribute('class'))){
    p.animate([{opacity:0},{opacity:getComputedStyle(p).opacity}],{duration:900,delay:350,fill:'backwards',easing:'ease'});
  }else{
    const L=p.getTotalLength();
    p.animate([{strokeDasharray:`${L} ${L}`,strokeDashoffset:L},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0}],{duration:900,easing:'cubic-bezier(.3,.7,.2,1)'});
  }
}
function pulse(a,b,color,dur){
  let p=edgeEl[a+'>'+b],rev=false;
  if(!p){p=edgeEl[b+'>'+a];rev=true}
  if(!p)return;
  const L=p.getTotalLength(),seg=Math.min(70,L*.35);
  const q=document.createElementNS(NS,'path');q.setAttribute('d',p.getAttribute('d'));q.setAttribute('class','pulse '+color);
  q.style.strokeDasharray=`${seg} ${L+seg}`;svg.appendChild(q);
  const from=rev?-L:seg,to=rev?seg:-L;
  const an=q.animate([{strokeDashoffset:from,opacity:1},{strokeDashoffset:to,opacity:.85}],{duration:dur||650,easing:'ease-in-out'});
  an.onfinish=an.oncancel=()=>q.remove();
}
function runFx(fx){
  if(fx.flows)fx.flows.forEach(([a,b])=>later(()=>pulse(a,b,'red',700),250));
  if(fx.gold)fx.gold.forEach(([a,b])=>later(()=>pulse(a,b,'gold',800),300));
  if(fx.loop)loopFx();
  if(fx.converge)convergeFx();
}
// круг: худеть → голод → переедание → стыд → худеть (всё быстрее)
function loopFx(){
  const ring=[['hudet','golod'],['golod','pereed'],['pereed','styd'],['styd','hudet']];
  let t=700;
  for(let r=0;r<5;r++){
    const d=Math.max(330,700-r*90);
    ring.forEach(([a,b])=>{later(()=>{pulse(a,b,'red',d);flashNode(b,d-120)},t);t+=d*.85});
  }
}
// всё сходится к еде: волны идут к ЕДЕ из самых дальних узлов
function convergeFx(){
  const s=steps[state].st,rev={};
  Object.keys(s.edges).forEach(k=>{const [a,b]=k.split('>');(rev[b]=rev[b]||[]).push(a)});
  const dist={eda:0};let level=['eda'],dmax=0;
  while(level.length){const nx=[];level.forEach(v=>(rev[v]||[]).forEach(u=>{if(dist[u]===undefined){dist[u]=dist[v]+1;dmax=Math.max(dmax,dist[u]);nx.push(u)}}));level=nx}
  Object.keys(s.edges).forEach(k=>{const [a,b]=k.split('>');
    if(dist[a]!==undefined&&dist[b]!==undefined&&dist[b]===dist[a]-1)later(()=>pulse(a,b,'gold',560),1500+(dmax-dist[a])*480+((hash(k)>>>0)%5)*40)});
}

// ───────── Волна (свободный режим) ─────────
let waveTimers=[];
function wave(start){
  const s=steps[state].st;
  const adj={};
  Object.keys(s.edges).forEach(k=>{const [a,b]=k.split('>');(adj[a]=adj[a]||[]).push(b)});
  const isExit=id=>!!EXITS[id];
  const seen=new Set([start]);let level=[start],d=0;
  flashNode(start,0);
  while(level.length){
    const nextLevel=[];
    level.forEach(u=>{
      if(isExit(u)&&u!==start)return;
      (adj[u]||[]).forEach(v=>{
        const t=d*360+120;
        later(()=>pulse(u,v,'white',420),t);
        if(!seen.has(v)){seen.add(v);nextLevel.push(v);flashNode(v,t+380)}
      });
    });
    level=nextLevel;d++;
  }
}
function later(f,t){const my=epoch;waveTimers.push(setTimeout(()=>{if(my===epoch)f()},t))}
function flashNode(id,t){
  later(()=>{
    if(EXITS[id]){
      const el=exitEl[id];if(!el.classList.contains('x-red'))return;
      el.classList.add('burn');
      clearTimeout(el._cool);el._cool=setTimeout(()=>el.classList.remove('burn'),4200);
      return;
    }
    const el=nodeEl[id];el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  },t);
}

// ───────── Управление ─────────
function stopAll(){epoch++;waveTimers.forEach(clearTimeout);waveTimers=[];
  svg.querySelectorAll('.pulse').forEach(p=>p.remove());
  Object.values(exitEl).forEach(el=>el.classList.remove('burn'));
  document.getAnimations().forEach(a=>{if(a.effect&&a.effect.target&&a.effect.target.closest&&a.effect.target.closest('#stage'))a.cancel()});
}
function forward(){if(state>=MAX)return;epoch++;render(state+1,true)}
function back(){if(state<=0)return;stopAll();render(state-1,false)}
function jumpTo(k){stopAll();render(k,false)}
document.querySelectorAll('#jumps button').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();jumpTo(MARK[b.dataset.mark]);b.blur()}));
document.addEventListener('click',ev=>{
  if(ev.button!==0)return;
  if(ev.target.closest('a,#jumps'))return;
  if(steps[state].st.free){
    const nd=ev.target.closest('.node:not(.off)'),ex=ev.target.closest('.exit.x-red');
    if(nd)wave(nd.dataset.id);else if(ex)wave(ex.dataset.exit);
    return;
  }
  forward();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='Enter'){ev.preventDefault();forward()}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();back()}
});
addEventListener('resize',fit);
fit();render(0,false);requestAnimationFrame(frame);
window.__lena={steps,go:jumpTo,wave,get state(){return state},MAX,NODES,EXITS,EXIT_ORDER,MARK,
  still(v){still=v},widths(){const o={};Object.entries(nodeEl).forEach(([id,el])=>o[id]=[el.offsetWidth,el.offsetHeight]);Object.entries(exitEl).forEach(([id,el])=>o['x:'+id]=[el.offsetWidth,el.offsetHeight]);return o}};
})();
</script>

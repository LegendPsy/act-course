 ()=>{n('telo','c-neutral');n('nastya','c-neutral');n('hudaya','c-warm');n('vybir','c-warm');e('nastya','hudaya','g');e('nastya','vybir','g')},

MARK.net=steps.length-1;
// Финал
st.tl=11;st.scene={id:'kabinet',b:0};S({},'cab');
SCENES.kabinet.b.forEach((_,k)=>{st.scene.b=k+1;S()});
st.scene=null;st.thumbs.push('kabinet');st.card=['25 лет · Кабинет','«У меня проблема с едой»',''];S({fly:'kabinet'});
st.cam='eda';S();
st.cam='norm';S();                                                                    // 34
st.card=null;st.q='С чем мы будем работать?';st.wh=0;S();                             // 35
st.free=true;STIM.forEach(id=>n(id,'stim'));
e('st_wed','ya','s');e('st_promo','ocenki','s');e('st_boss','oshibka','s');e('st_date','vstrecha','s');e('st_eve','odin','s');S({},'free');
const MAX=steps.length-1;

// ───────── Построение DOM ─────────
const $=id=>document.getElementById(id);
const stage=$('stage'),cam=$('cam'),svg=$('edges'),title=$('title');
const NS='http://www.w3.org/2000/svg';
const nodeEl={},exitEl={},edgeEl={},whEl=[],tlEls=[];
Object.entries(NODES).forEach(([id,[t,X,Y]])=>{
  const d=document.createElement('div');d.className='node off';d.dataset.id=id;d.textContent=t;
  d.style.left=X+'px';d.style.top=Y+'px';$('nodes').appendChild(d);nodeEl[id]=d;
});
Object.entries(EXITS).forEach(([id,[t,Y]])=>{
  const d=document.createElement('div');d.className='exit x-off';d.dataset.exit=id;d.textContent=t;d.style.top=Y+'px';
  $('exits').appendChild(d);exitEl[id]=d;
});
WHISPERS.forEach(([t,Y])=>{const d=document.createElement('div');d.className='wh';d.textContent=t;d.style.left='24px';d.style.top=Y+'px';$('whs').appendChild(d);whEl.push(d)});
TL.forEach(([age,name],i)=>{
  const X=120+i*(1360/(TL.length-1));
  const dot=document.createElement('div');dot.className='tlDot';dot.style.left=X+'px';
  const a=document.createElement('div');a.className='tlAge';a.style.left=X+'px';a.textContent=age;
  const nm=document.createElement('div');nm.className='tlName';nm.style.left=X+'px';nm.textContent=name;
  $('tl').append(dot,a,nm);tlEls.push([dot,a,nm]);
});
const coverEl=[];
for(let k=0;k<9;k++){   // панели 96×54 с шагом 100×58 и полем 2px на холсте 300×174
  const c=k%3,r=Math.floor(k/3),sx=1125/300,sy=652.5/174;
  const d=document.createElement('div');d.className='cover';
  Object.assign(d.style,{left:((2+c*100)*sx-3)+'px',top:((2+r*58)*sy-3)+'px',width:(96*sx+6)+'px',height:(54*sy+6)+'px'});
  $('covers').appendChild(d);coverEl.push(d);
}
const thumbEl={},bubEls={};
Object.entries(SCENES).forEach(([id,sc])=>{
  const X=120+sc.tl*(1360/(TL.length-1));
  const im=document.createElement('img');im.className='tlThumb';im.src=sc.src;im.alt='';im.style.left=X+'px';
  $('tl').appendChild(im);thumbEl[id]=im;
  bubEls[id]=sc.b.map(b=>{
    const k=IMG.k,bx=IMG.x+b.box[0]*k,by=IMG.y+b.box[1]*k,bw=b.box[2]*k;
    const d=document.createElement('div');d.className='bub';d.textContent=b.t;
    d.style.left=bx+'px';d.style.top=by+'px';d.style.width=bw+'px';
    const ax=IMG.x+b.dot[0]*k,ay=IMG.y+b.dot[1]*k;
    d.style.setProperty('--ox',(ax<bx?'0%':ax>bx+bw?'100%':'50%'));d.style.setProperty('--oy','100%');
    $('bubbles').appendChild(d);
    return {el:d,ax,ay,dots:[]};
  });
});
function placeDots(id){   // «пузырьки» от облака к говорящему — после того как известна высота облака
  bubEls[id].forEach(B=>{
    if(B.dots.length)return;
    const r={x:parseFloat(B.el.style.left),y:parseFloat(B.el.style.top),w:B.el.offsetWidth,h:B.el.offsetHeight};
    const sx=Math.max(r.x+20,Math.min(r.x+r.w-20,B.ax)),sy=r.y+r.h;
    [0.3,0.58,0.82].forEach((t,i)=>{
      const sz=[22,15,10][i];const d=document.createElement('div');d.className='bubDot';
      d.style.width=d.style.height=sz+'px';
      d.style.left=(sx+(B.ax-sx)*t-sz/2)+'px';d.style.top=(sy+(B.ay-sy)*t-sz/2)+'px';
      $('bubbles').appendChild(d);B.dots.push(d);
    });
  });
}
function pt(id){
  if(NODES[id])return {x:NODES[id][1],y:NODES[id][2]};
  return {x:EXIT_X+6,y:EXITS[id][1]};
}
function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h}
const allEdges={};steps.forEach(s=>Object.assign(allEdges,s.st.edges));
Object.entries(allEdges).forEach(([key,type])=>{
  const [a,b]=key.split('>');const A=pt(a),B=pt(b);
  const dx=B.x-A.x,dy=B.y-A.y,len=Math.hypot(dx,dy)||1;
  let bend=BEND[key]!==undefined?BEND[key]:(hash(key)%2?1:-1)*Math.min(26,len*.07);
  const cx=(A.x+B.x)/2-dy/len*bend,cy=(A.y+B.y)/2+dx/len*bend;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d',`M${A.x} ${A.y} Q${cx} ${cy} ${B.x} ${B.y}`);
  p.setAttribute('class','e off e-'+type);p.dataset.key=key;
  svg.appendChild(p);edgeEl[key]=p;
});

// ───────── Отрисовка ─────────
let state=0,prev=null,epoch=0;
function fit(){
  const s=Math.min(innerWidth/1600,innerHeight/900);
  stage.style.transform=`translate(${(innerWidth-1600*s)/2}px,${(innerHeight-900*s)/2}px) scale(${s})`;
}
function setCard(c){
  const key=JSON.stringify(c);
  if($('card').dataset.key===key)return;
  $('card').dataset.key=key;
  $('eyebrow').textContent=c?c[0]:'';$('main').textContent=c?c[1]:'';$('sub').textContent=c?c[2]:'';
  $('card').style.opacity=c?1:0;
  if(c){const el=$('card');el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
}
function render(i,animate){
  state=Math.max(0,Math.min(MAX,i));
  const s=steps[state].st,old=prev;
  if(!animate)document.body.classList.add('instant');
  title.classList.toggle('hidden',!s.title);
  setCard(s.card);
  // узлы
  Object.keys(NODES).forEach(id=>{
    const el=nodeEl[id],c=s.nodes[id];
    let cls='node '+(c?(c==='stim'?'stim':c):'off');
    if(id==='eda')cls+=' keep';
    if(animate&&old&&old.nodes[id]&&c&&old.nodes[id]!==c)el.style.transitionDelay='.6s';else el.style.transitionDelay='';
    el.className=cls;
  });
  // связи
  Object.entries(edgeEl).forEach(([key,p])=>{
    const on=!!s.edges[key];const was=old&&old.edges[key];
    p.classList.toggle('off',!on);
    if(animate&&on&&!was)drawIn(p);
  });
  // выходы
  let vis=0;
  EXIT_ORDER.forEach(([id])=>{
    const el=exitEl[id],v=s.exits[id]||'x-off';
    if(v!=='x-off'){el.style.top=(EXIT_Y0+vis*EXIT_DY)+'px';vis++}
    const burn=el.classList.contains('burn')&&s.free;
    el.className='exit '+v+(id==='hudet'&&s.strong?' strong':'')+(burn?' burn':'');
  });
  $('exitsHead').style.opacity=Object.keys(s.exits).length?1:0;
  whEl.forEach((w,k)=>w.classList.toggle('on',k<s.wh));
  // лента
  tlEls.forEach(([dot,a,nm],k)=>{
    const now=k===s.tl,past=k<s.tl;
    dot.className='tlDot'+(now?' now':past?' past':'');
    a.className='tlAge'+(now?' now':'')+(k>s.tl?' tlHide':'');
    nm.className='tlName'+(now?' now':'')+(k>s.tl?' tlHide':'');
  });
  $('tl').style.opacity=(s.title||s.cam==='eda')?0:1;
  // камера
  if(s.cam==='eda'){
    const k=2.4,[,X,Y]=NODES.eda;
    cam.style.transform=`translate(${800-k*X}px,${470-k*Y}px) scale(${k})`;
    cam.classList.add('solo');stage.classList.add('solo');
  }else{cam.style.transform='';cam.classList.remove('solo');stage.classList.remove('solo')}
  // коллаж-знакомство
  $('collage').classList.toggle('on',s.collage!==null&&s.collage!==undefined);
  coverEl.forEach((c,k)=>c.classList.toggle('open',s.collage!==null&&k<s.collage));
  // сцена-картинка
  if(s.scene){
    const sc=SCENES[s.scene.id];
    if($('sceneImg').dataset.id!==s.scene.id){$('sceneImg').src=sc.src;$('sceneImg').dataset.id=s.scene.id}
    $('scene').classList.add('on');
    document.fonts.ready.then(()=>placeDots(s.scene.id));placeDots(s.scene.id);
    Object.entries(bubEls).forEach(([id,arr])=>arr.forEach((B,k)=>{
      const on=id===s.scene.id&&k<s.scene.b;B.el.classList.toggle('on',on);B.dots.forEach(d=>d.classList.toggle('on',on));
    }));
  }else{
    $('scene').classList.remove('on');
    Object.values(bubEls).forEach(arr=>arr.forEach(B=>{B.el.classList.remove('on');B.dots.forEach(d=>d.classList.remove('on'))}));
  }
  Object.entries(thumbEl).forEach(([id,im])=>{
    const on=s.thumbs.includes(id);im.classList.toggle('on',on&&!(animate&&steps[state].fx.fly===id));
    im.classList.toggle('now',SCENES[id].tl===s.tl);
  });
  if(animate&&steps[state].fx.fly)flyToThumb(steps[state].fx.fly);
  $('q').textContent=s.q;$('q').classList.toggle('on',!!s.q);
  document.body.classList.toggle('free',s.free);
  document.querySelectorAll('#jumps button').forEach(b=>b.classList.toggle('on',MARK[b.dataset.mark]===state));
  if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.remove('instant')));
  if(animate)runFx(steps[state].fx);
  prev=s;
}
function flyToThumb(id){
  const sc=SCENES[id],f=$('flyImg'),th=thumbEl[id];
  const X=120+sc.tl*(1360/(TL.length-1));
  const to={x:X-36,y:803,w:72,h:40.5},from=sc.rect||{x:IMG.x,y:IMG.y,w:1440,h:810};
  f.src=sc.src;Object.assign(f.style,{display:'block',left:from.x+'px',top:from.y+'px',width:from.w+'px',height:from.h+'px'});
  const an=f.animate([{transform:'none',opacity:1},{transform:`translate(${to.x-from.x}px,${to.y-from.y}px) scale(${to.w/from.w},${to.h/from.h})`,opacity:1}],
    {duration:900,easing:'cubic-bezier(.45,.05,.25,1)'});
  an.onfinish=()=>{f.style.display='none';th.classList.add('on')};
  an.oncancel=()=>{f.style.display='none'};
}
function drawIn(p){
  const L=p.getTotalLength();
  if(p.classList.contains('e-d')||p.classList.contains('e-s')||p.classList.contains('e-b')){
    p.animate([{opacity:0},{opacity:getComputedStyle(p).opacity}],{duration:900,delay:350,fill:'backwards',easing:'ease'});
  }else{
    p.animate([{strokeDasharray:`${L} ${L}`,strokeDashoffset:L},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0}],{duration:900,easing:'cubic-bezier(.3,.7,.2,1)'});
  }
}
function pulse(a,b,color,dur){
  let p=edgeEl[a+'>'+b],rev=false;
  if(!p){p=edgeEl[b+'>'+a];rev=true}
  if(!p)return;
  const L=p.getTotalLength(),seg=Math.min(70,L*.35);
  const q=document.createElementNS(NS,'path');q.setAttribute('d',p.getAttribute('d'));q.setAttribute('class','pulse '+color);
  q.style.strokeDasharray=`${seg} ${L+seg}`;svg.appendChild(q);
  const from=rev?-L:seg,to=rev?seg:-L;
  const an=q.animate([{strokeDashoffset:from,opacity:1},{strokeDashoffset:to,opacity:.85}],{duration:dur||650,easing:'ease-in-out'});
  an.onfinish=an.oncancel=()=>q.remove();
}
function runFx(fx){
  if(fx.flows)fx.flows.forEach(([a,b])=>pulse(a,b,'red',700));
}

// ───────── Волна (свободный режим) ─────────
let waveTimers=[];
function wave(start){
  const s=steps[state].st;
  const adj={};
  Object.keys(s.edges).forEach(k=>{const [a,b]=k.split('>');(adj[a]=adj[a]||[]).push(b)});
  const isExit=id=>!!EXITS[id];
  const seen=new Set([start]);let level=[start],d=0;
  flashNode(start,0);
  while(level.length){
    const nextLevel=[];
    level.forEach(u=>{
      if(isExit(u)&&u!==start)return;
      (adj[u]||[]).forEach(v=>{
        const t=d*360+120;
        later(()=>pulse(u,v,'white',420),t);
        if(!seen.has(v)){seen.add(v);nextLevel.push(v);flashNode(v,t+380)}
      });
    });
    level=nextLevel;d++;
  }
}
function later(f,t){const my=epoch;waveTimers.push(setTimeout(()=>{if(my===epoch)f()},t))}
function flashNode(id,t){
  later(()=>{
    if(EXITS[id]){
      const el=exitEl[id];if(!el.classList.contains('x-red'))return;
      el.classList.add('burn');
      clearTimeout(el._cool);el._cool=setTimeout(()=>el.classList.remove('burn'),4200);
      return;
    }
    const el=nodeEl[id];el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
  },t);
}

// ───────── Управление ─────────
function stopAll(){epoch++;waveTimers.forEach(clearTimeout);waveTimers=[];
  svg.querySelectorAll('.pulse').forEach(p=>p.remove());
  Object.values(exitEl).forEach(el=>el.classList.remove('burn'));
  document.getAnimations().forEach(a=>{if(a.effect&&a.effect.target&&a.effect.target.closest&&a.effect.target.closest('#stage'))a.cancel()});
}
function forward(){if(state>=MAX)return;render(state+1,true)}
function back(){if(state<=0)return;stopAll();render(state-1,false)}
function jumpTo(k){stopAll();render(k,false)}
document.querySelectorAll('#jumps button').forEach(b=>b.addEventListener('click',ev=>{ev.stopPropagation();jumpTo(MARK[b.dataset.mark]);b.blur()}));
document.addEventListener('click',ev=>{
  if(ev.button!==0)return;
  if(ev.target.closest('a,#jumps'))return;
  if(steps[state].st.free){
    const nd=ev.target.closest('.node:not(.off)'),ex=ev.target.closest('.exit.x-red');
    if(nd)wave(nd.dataset.id);else if(ex)wave(ex.dataset.exit);
    return;
  }
  forward();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowRight'||ev.key===' '||ev.key==='Enter'){ev.preventDefault();forward()}
  else if(ev.key==='ArrowLeft'){ev.preventDefault();back()}
});
addEventListener('resize',fit);
fit();render(0,false);
window.__lena={steps,go:jumpTo,wave,get state(){return state},MAX};
})();
